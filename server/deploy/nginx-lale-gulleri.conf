# Nginx site for Lale Gülleri.
# Copy to /etc/nginx/sites-available/lale-gulleri and replace YOUR-DOMAIN.
# The website (dist folder) is served directly; /api goes to the Node server.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR-DOMAIN www.YOUR-DOMAIN;

    root /var/www/lale-gulleri/dist;
    index index.html;

    # admin photo uploads (8 photos per flower)
    client_max_body_size 32m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # shop server (orders, accounts, admin)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # product photos uploaded in the admin panel
    location /uploads/ {
        alias /var/www/lale-gulleri/server/uploads/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # website files with a content hash in the name never change
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # every page address (/catalog, /product/5, /admin ...) opens the website
    location / {
        try_files $uri $uri/ /index.html;
    }
}
